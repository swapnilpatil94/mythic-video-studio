name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run validate -- examples/karna-short.json
      - run: npm run check:motion
      - run: npm run check:visual-beats -- examples/karna-short.json
      - run: npm run check:pipeline -- examples/karna-short.json
