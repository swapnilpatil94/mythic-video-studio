<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kathaaya Studio</title><style>body{margin:0;background:#12100d;color:#f4e8cf;font:14px system-ui,sans-serif}header{padding:20px 28px;border-bottom:1px solid #3b3328;display:flex;justify-content:space-between}main{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 73px)}aside{padding:20px;border-right:1px solid #3b3328}section{padding:24px;max-width:1200px}button,input,select,textarea{background:#1d1914;color:#f4e8cf;border:1px solid #514637;border-radius:7px;padding:9px}button{cursor:pointer}button:hover{border-color:#b8872d}.brand{letter-spacing:.18em;font-weight:700;color:#d7aa55}.muted{color:#a89b88}.card{border:1px solid #3b3328;border-radius:10px;padding:16px;margin:10px 0}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tabs button.active{background:#b8872d;color:#171510}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}textarea{width:100%;min-height:420px;box-sizing:border-box;font:12px ui-monospace,monospace}.pill{display:inline-block;padding:4px 8px;border:1px solid #514637;border-radius:999px}.danger{border-color:#8e2f24;color:#efb0a7}.ok{color:#9bc98d}.err{color:#efb0a7}@media(max-width:800px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #3b3328}}</style></head><body><header><div><div class="brand">KATHAAYA</div><div class="muted">Ancient Stories. Reimagined Through Ink.</div></div><div id="status" class="muted">Local Studio</div></header><main><aside><button onclick="newProject()">＋ New Project</button><h3>Projects</h3><div id="projects"></div></aside><section id="app"><h2>Mythic Video Studio</h2><p class="muted">Create, import, edit and produce Kathaaya Shorts and Long-form projects.</p><div class="card"><h3>Story Package</h3><p>Paste one JSON package from ChatGPT/Claude. Studio splits it into the canonical project files.</p><textarea id="importBox" style="min-height:180px" placeholder='{"project":{},"story":{},"script":{},"characters":[],"environments":[],"props":[],"visual_manifest":{},"audio":{},"metadata":{},"sources":[]}'></textarea><button onclick="importPackage()">Validate & Create Project</button><div id="importMsg"></div></div></section></main><script>let current=null,tab='project';const files=['project.json','story.json','script.json','manifest.json','characters.json','metadata.json'];const $=id=>document.getElementById(id);async function api(url,opt){const r=await fetch(url,opt);const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}async function load(){const ps=await api('/api/projects');$('projects').innerHTML=ps.map(p=>`<div class="card" style="cursor:pointer" onclick="openProject('${p.id}')"><b>${esc(p.project_name)}</b><br><span class="pill">${p.format}</span> <span class="muted">${p.target_duration_seconds||0}s</span></div>`).join('')||'<p class="muted">No projects yet.</p>'}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function newProject(){const name=prompt('Project name');if(!name)return;const format=confirm('Long-form? OK = longform, Cancel = short')?'longform':'short';try{const p=await api('/api/projects',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,format,language:'hi-IN'})});await load();openProject(p.id)}catch(e){alert(e.message)}}async function importPackage(){try{const pkg=JSON.parse($('importBox').value);const p=await api('/api/projects/import',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(pkg)});$('importMsg').innerHTML='<span class="ok">Created '+esc(p.project_name)+'</span>';await load();openProject(p.id)}catch(e){$('importMsg').innerHTML='<span class="err">'+esc(e.message)+'</span>'}}async function openProject(id){current=await api('/api/projects/'+id);tab='project';render()}function render(){const p=current.project;const nav=files.map(f=>`<button class="${tab===f?'active':''}" onclick="tab='${f}';render()">${f.replace('.json','')}</button>`).join('');$('app').innerHTML=`<div class="row"><div><h2>${esc(p.project_name)}</h2><span class="pill">${p.format}</span> <span class="pill">${p.language}</span></div><div style="margin-left:auto"><button onclick="runProject()">▶ Produce</button><button class="danger" onclick="deleteProject()">Delete</button></div></div><div class="tabs">${nav}</div>${tab==='project'?overview():editor(tab)}`}function overview(){return `<div class="grid"><div class="card"><b>Brand</b><p>KATHAAYA</p><span class="muted">Ancient Stories. Reimagined Through Ink.</span></div><div class="card"><b>Format</b><p>${pformat()}</p><span class="muted">One engine, format-aware timing/density.</span></div><div class="card"><b>Files</b><p>${current.project.files.length}/6 canonical files</p></div><div class="card"><b>Renders</b><p>${(current.project.renders||[]).join('<br>')||'None yet'}</p></div></div><div class="card"><h3>Production</h3><p class="muted">Use Produce to invoke the existing run.sh pipeline. UI does not replace FLUX, Chatterbox, Whisper or Remotion.</p><div id="job"></div></div>`}function pformat(){return current.project.format==='longform'?'LONG-FORM':'SHORT'}function editor(file){const value=JSON.stringify(current.files[file]||{},null,2);return `<div class="row"><button onclick="saveFile('${file}')">Save</button><button onclick="formatEditor()">Format</button><button onclick="copyEditor()">Copy</button><button onclick="validateEditor()">Validate</button><span id="editMsg" class="muted"></span></div><textarea id="editor">${esc(value)}</textarea>`}async function saveFile(file){try{const content=$('editor').value;JSON.parse(content);await api('/api/projects/'+current.project.id+'/'+file,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({content})});current=await api('/api/projects/'+current.project.id);$('editMsg').textContent='Saved';}catch(e){$('editMsg').textContent=e.message}}function formatEditor(){try{$('editor').value=JSON.stringify(JSON.parse($('editor').value),null,2);$('editMsg').textContent='Formatted'}catch(e){$('editMsg').textContent='Invalid JSON'}}async function copyEditor(){await navigator.clipboard.writeText($('editor').value);$('editMsg').textContent='Copied'}function validateEditor(){try{JSON.parse($('editor').value);$('editMsg').textContent='Valid JSON'}catch(e){$('editMsg').textContent='Invalid JSON'}}async function runProject(){try{const j=await api('/api/projects/'+current.project.id+'/run',{method:'POST'});$('job').innerHTML='Job '+j.id+' started. Refresh to view status.';poll(j.id)}catch(e){alert(e.message)}}async function poll(id){const j=await api('/api/jobs/'+id);$('job').innerHTML=`<p>Status: <b>${j.status}</b></p><pre style="white-space:pre-wrap;max-height:360px;overflow:auto">${esc(j.logs)}</pre>`;if(j.status==='running')setTimeout(()=>poll(id),1500);else load()}async function deleteProject(){if(!confirm('Delete this project?'))return;await api('/api/projects/'+current.project.id,{method:'DELETE'});current=null;await load();location.reload()}load().catch(e=>console.error(e));</script></body></html>
